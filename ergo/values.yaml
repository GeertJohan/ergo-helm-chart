# Hostname for the IRC server (used for certificate and external-dns)
hostname: "irc.example.com"

image:
  repository: ghcr.io/ergochat/ergo
  tag: "v2.15.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"

certificate:
  enabled: true
  secretName: ergo-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Ergo IRC server - see https://ergo.chat/manual.html for full documentation
ergo:
  motd: |
    Welcome to Ergo IRC Server

    Please register your nick: /msg nickserv register <password> <email>

  config:
    network:
      name: MyNetwork

    server:
      name: irc.example.com

      listeners:
        ":6697":
          tls:
            key: /ircd/tls/tls.key
            cert: /ircd/tls/tls.crt
          proxy: true

        ":443":
          websocket: true
          tls:
            key: /ircd/tls/tls.key
            cert: /ircd/tls/tls.crt
          proxy: true

      unix-bind-mode: 0777

      sts:
        enabled: true
        duration: 1mo2d5m
        port: 6697
        preload: false

      websockets:
        allowed-origins: []

      casemapping: "precis"
      enforce-utf8: true
      lookup-hostnames: false
      forward-confirm-hostnames: true
      check-ident: false
      coerce-ident: "~u"

      motd: ergo.motd
      motd-formatting: true

      relaymsg:
        enabled: true
        separators: "/"
        available-to-chanops: true

      proxy-allowed-from:
        - 0.0.0.0/0

      max-sendq: 96k

      compatibility:
        force-trailing: true
        send-unprefixed-sasl: true

      ip-limits:
        count: true
        max-concurrent-connections: 64
        throttle: true
        window: 10m
        max-connections-per-window: 64
        throttle-ban-duration: 10m
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        exempted:
          - "localhost"
        custom-limits: {}

      ip-cloaking:
        enabled: true
        enabled-for-always-on: true
        netname: "irc"
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        num-bits: 64

    accounts:
      authentication-enabled: true

      registration:
        enabled: true
        allow-before-connect: true
        bcrypt-cost: 12
        verify-timeout: "32h"
        enabled-callbacks:
          - none

      login-throttling:
        enabled: true
        duration: 1m
        max-attempts: 3

      skip-server-password: false
      login-via-pass-command: true

      require-sasl:
        enabled: false
        exempted:
          - "localhost"

      nick-reservation:
        enabled: true
        additional-nick-limit: 2
        method: strict
        allow-custom-enforcement: false
        rename-timeout: 30s
        rename-prefix: Guest-
        force-nick-equals-account: true

      multiclient:
        enabled: true
        allowed-by-default: true
        always-on: "opt-in"
        auto-away: "opt-in"

      vhosts:
        enabled: true
        max-length: 64
        valid-regexp: '^[0-9A-Za-z.\-_/]+$'
        user-requests:
          enabled: false
          cooldown: 168h

    channels:
      default-modes: +nt
      max-channels-per-client: 100
      operator-only-creation: false

      registration:
        enabled: true
        max-channels-per-account: 15

      list-delay: 0s
      invite-expiration: 24h

    oper-classes:
      "server-admin":
        title: Server Admin
        capabilities:
          - "rehash"
          - "die"
          - "accreg"
          - "sajoin"
          - "samode"
          - "vhosts"
          - "chanreg"
          - "history"
          - "defcon"
          - "kill"
          - "ban"
          - "nofakelag"
          - "relaymsg"

    opers: {}

    logging:
      - method: stderr
        type: "* -userinput -useroutput -localconnect -localconnect-ip"
        level: info

    debug:
      recover-from-errors: true

    datastore:
      path: /ircd/db/ircd.db
      autoupgrade: true

    languages:
      enabled: false
      default: en
      path: languages

    limits:
      nicklen: 32
      identlen: 20
      channellen: 64
      awaylen: 500
      kicklen: 1000
      topiclen: 1000
      monitor-entries: 100
      whowas-entries: 100
      chan-list-modes: 60
      linelen:
        rest: 2048
      registration-messages: 1024
      multiline:
        max-bytes: 4096
        max-lines: 24

    fakelag:
      enabled: true
      window: 1s
      burst-limit: 5
      messages-per-window: 2
      cooldown: 2s
      command-budgets:
        "CHATHISTORY": 16
        "MARKREAD": 16
        "MONITOR": 1
        "WHO": 4

    history:
      enabled: true
      channel-length: 2048
      client-length: 256
      autoresize-window: 3d
      autoreplay-on-join: 0
      chathistory-maxmessages: 100
      znc-maxmessages: 2048
      restrictions:
        expire-time: 1w
        enforce-registration-date: false
        grace-period: 1h
      persistent:
        enabled: false
      retention:
        allow-individual-delete: false
        enable-account-indexing: false
      tagmsg-storage:
        default: false
        whitelist:
          - "+draft/react"
          - "+react"

    allow-environment-overrides: true
